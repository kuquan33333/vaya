name: Validate and deploy Cloudflare

on:
  pull_request:
  push:
    branches: [master, feat/vaytiendanang-cloudflare-full]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        required: true
        default: production
        type: choice
        options: [staging, production]

permissions:
  contents: read

concurrency:
  group: cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:vinext

  deploy:
    # PR/feature pushes run validation only. Production deploys after merge to master
    # or an explicit workflow_dispatch; never deploy an unreviewed feature branch.
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/master') ||
      github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    env:
      # The API token is the only deployment credential. Resource IDs and URLs
      # identify the existing public Cloudflare resources and are intentionally
      # kept out of the secret store so runtime secrets can be added later.
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT_ID: 3c04ddef6532e9e73c807a4de0664e4c
      PRODUCTION_D1_ID: 07cc23dc-18f2-4e6e-9fa2-7cae5ff5f65a
      STAGING_D1_ID: cd1b1733-dbc1-4bc4-a84f-a14085796720
      PRODUCTION_PUBLIC_SITE_URL: https://vaytiendanang.pages.dev
      STAGING_PUBLIC_SITE_URL: https://staging.vaytiendanang.pages.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Select target
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.target }}" == "staging" ]] || [[ "${{ github.event_name }}" == "push" && "${GITHUB_REF}" == "refs/heads/feat/vaytiendanang-cloudflare-full" ]]; then
            echo "DEPLOY_TARGET=staging" >> "$GITHUB_ENV"
            echo "CF_APP_WORKER_NAME=vaytiendanang-staging" >> "$GITHUB_ENV"
            echo "CF_INGESTOR_WORKER_NAME=vaytiendanang-staging-ingestor" >> "$GITHUB_ENV"
            echo "CF_D1_DATABASE_NAME=vaytiendanang-staging-db" >> "$GITHUB_ENV"
            echo "CF_LEAD_QUEUE_NAME=vaytiendanang-staging-lead-notifications" >> "$GITHUB_ENV"
            echo "CF_LEAD_QUEUE_DLQ_NAME=vaytiendanang-staging-lead-notifications-dlq" >> "$GITHUB_ENV"
            echo "CF_RATE_LIMIT_SUFFIX=-staging" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_D1_DATABASE_ID=${STAGING_D1_ID}" >> "$GITHUB_ENV"
            echo "PUBLIC_SITE_URL=${STAGING_PUBLIC_SITE_URL}" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_PAGES_CONFIG=preview" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_PAGES_BRANCH=staging" >> "$GITHUB_ENV"
          else
            echo "DEPLOY_TARGET=production" >> "$GITHUB_ENV"
            echo "CF_APP_WORKER_NAME=vaytiendanang" >> "$GITHUB_ENV"
            echo "CF_INGESTOR_WORKER_NAME=vaytiendanang-ingestor" >> "$GITHUB_ENV"
            echo "CF_D1_DATABASE_NAME=vaytiendanang-db" >> "$GITHUB_ENV"
            echo "CF_LEAD_QUEUE_NAME=vaytiendanang-lead-notifications" >> "$GITHUB_ENV"
            echo "CF_LEAD_QUEUE_DLQ_NAME=vaytiendanang-lead-notifications-dlq" >> "$GITHUB_ENV"
            echo "CF_RATE_LIMIT_SUFFIX=" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_D1_DATABASE_ID=${PRODUCTION_D1_ID}" >> "$GITHUB_ENV"
            echo "PUBLIC_SITE_URL=${PRODUCTION_PUBLIC_SITE_URL}" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_PAGES_CONFIG=production" >> "$GITHUB_ENV"
            echo "CLOUDFLARE_PAGES_BRANCH=master" >> "$GITHUB_ENV"
          fi
          test -n "$CF_API_TOKEN" || { echo "Missing GitHub Actions secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CF_ACCOUNT_ID"
          test -n "$CLOUDFLARE_D1_DATABASE_ID"
          test -n "$PUBLIC_SITE_URL"
      - name: Apply D1 migrations
        run: npm run d1:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
      - name: Deploy frontend/API Worker
        run: npx cf deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
      - name: Deploy crawler and Queue consumer Worker
        working-directory: workers/ingestor
        run: npx cf deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
      - name: Reconcile Pages Service Binding
        run: node scripts/configure-pages-gateway.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
      - name: Deploy existing Pages gateway project
        run: node scripts/deploy-pages-gateway.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ env.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ env.CF_ACCOUNT_ID }}
      - name: Verify public gateway and health
        run: |
          curl --fail --show-error --silent --retry 5 --retry-delay 5 "$PUBLIC_SITE_URL/"
          curl --fail --show-error --silent --retry 5 --retry-delay 5 "$PUBLIC_SITE_URL/api/catalog"
          health_code=$(curl --show-error --silent --retry 5 --retry-delay 5 -o /tmp/vaytiendanang-health.json -w '%{http_code}' "$PUBLIC_SITE_URL/api/health")
          case "$health_code" in
            200) ;;
            503)
              # Optional AI/Telegram/Turnstile/Zalo integrations may be absent
              # in a fresh environment. Deployment is still valid when the
              # critical data and queue checks are healthy; the response is
              # deliberately degraded rather than a fake all-green status.
              grep -q '"database":true' /tmp/vaytiendanang-health.json
              grep -q '"leadQueue":true' /tmp/vaytiendanang-health.json
              ;;
            *)
              echo "Unexpected health status: $health_code"
              cat /tmp/vaytiendanang-health.json
              exit 1
              ;;
          esac
